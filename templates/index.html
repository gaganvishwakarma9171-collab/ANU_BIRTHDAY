<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Anu ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: white;
        }

        .card {
            width: 90%;
            max-width: 600px;
            padding: 45px 25px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        .heart {
            font-size: 70px;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="heart">❤️</div>

        <h1>Happy Birthday Anu! 🎂</h1>

        <p>
            Wishing you a day filled with happiness,
            smiles, love and beautiful memories. 💕
        </p>

        <p>
            May all your dreams come true! ✨
        </p>
    </div>

</body>
</html>
